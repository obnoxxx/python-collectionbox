[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collectionbox"
version = "0.1.0"
description = "Educational, production-usable Python collection data structures."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "COPYING" }
authors = [
    { name = "Michael Adam", email = "obnox@samba.org" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "tox>=4.22",
]

[tool.setuptools.packages.find]
include = ["collectionbox*"]

# pytest config is in pytest.ini
#[tool.pytest.ini_options]
#pythonpath = ["."]

[tool.black]
target-version = ["py39"]

[tool.tox]
env_list = ["py39", "py310", "py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
description = "Run the test suite against an installed package"
deps = ["pytest>=8,<9"]
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }]]
