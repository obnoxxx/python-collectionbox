name: CI
on:

  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:

  build:
    name: lint  and test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false  # Let all jobs run even if one fails

    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
        id: go
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Install development and build tools
        run: pip install ".[dev]"
      - name: Install native linters
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: |
          pip install black
          npm install --global markdownlint-cli2
        shell: bash
      - name: run checks (linters and unit tests)
        run: make check
        shell: bash
